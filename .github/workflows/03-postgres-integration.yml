name: Verify backend PostgreSQL integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    # Keep the existing RC1/AUTH-D rehearsal separate from the full-chain lab.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.head_ref != 'fix/schema-recovery-staging') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patroai_ci
          POSTGRES_PASSWORD: patroai_ci_password
          POSTGRES_DB: patroai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patroai_ci -d patroai_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CI: "true"
      PLATFORM_ENVIRONMENT: "test"
      PLATFORM_AUTH_MODE: "test"
      PLATFORM_INVITATION_TOKEN_SECRET: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      DATABASE_URL: "postgresql+psycopg://patroai_ci:patroai_ci_password@127.0.0.1:5432/patroai_ci"
      AUTH_MIGRATION_REHEARSAL_ALLOW_DESTRUCTIVE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify immutable workflow action pinning
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_workflow_action_pinning.py

      - name: Install test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: PostgreSQL connectivity preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import sqlalchemy as sa

          engine = sa.create_engine(
              "postgresql+psycopg://patroai_ci:patroai_ci_password@127.0.0.1:5432/patroai_ci",
              pool_pre_ping=True,
          )
          with engine.connect() as conn:
              version = conn.exec_driver_sql("select current_setting('server_version')").scalar_one()
          print(f"POSTGRESQL_PREFLIGHT=PASS version={version}")
          PY

      - name: Verify migration hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_migration_hygiene.py

      - name: PostgreSQL migration rehearsal
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build-evidence
          python scripts/auth_migration_rehearsal.py             | tee build-evidence/postgres-migration-rehearsal.log

      - name: PostgreSQL-focused tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest             tests/test_database_url_normalization.py             tests/test_migration_chain_rc1_auth_d.py             tests/test_foundation_hardening_contract.py             --junitxml=build-evidence/postgres-pytest-junit.xml

      - name: Record evidence metadata
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build-evidence
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "python=$(python --version 2>&1 || true)"
            echo "postgres_integration=true"
          } > build-evidence/postgres-ci-metadata.txt

      - name: Upload PostgreSQL CI evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4 series immutable SHA
        with:
          name: orkio-backend-postgres-ci-evidence
          path: build-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Independent, non-destructive-to-Railway, fresh-schema laboratory.
  # The default-branch copy of THIS workflow already supports workflow_dispatch;
  # dispatching its fix-branch revision can use the normal Actions branch selector.
  postgres-fresh-001-016:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/schema-recovery-staging' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patroai_ci
          POSTGRES_PASSWORD: patroai_ci_password
          POSTGRES_DB: patroai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patroai_ci -d patroai_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "src"
      PLATFORM_ENVIRONMENT: "test"
      PLATFORM_AUTH_MODE: "test"
      PLATFORM_INVITATION_TOKEN_SECRET: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      DATABASE_URL: "postgresql+psycopg://patroai_ci:patroai_ci_password@127.0.0.1:5432/patroai_ci"

    steps:
      - name: Checkout candidate branch without persistent Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-test.lock.txt

      - name: Check action pinning
        run: python scripts/check_workflow_action_pinning.py

      - name: Install frozen Python test dependencies by hash
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --require-hashes -r requirements-test.lock.txt
          python -m pip check

      - name: Validate static migration candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build-evidence
          python -m pytest tests/test_schema_recovery_proposal_static.py \
            --junitxml=build-evidence/schema-recovery-static.xml

      - name: Rehearse PostgreSQL migrations 001 through 016 (no reset)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build-evidence
          python scripts/schema_recovery_full_chain_ci.py \
            | tee build-evidence/postgres-fresh-001-016.jsonl

      - name: Capture provenance without secrets
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build-evidence
          {
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'run=%s\n' "$GITHUB_RUN_ID"
            python --version
          } > build-evidence/postgres-fresh-provenance.txt
          sha256sum \
            .github/workflows/03-postgres-integration.yml \
            scripts/schema_recovery_full_chain_ci.py \
            requirements-test.lock.txt \
            > build-evidence/postgres-fresh-file-sha256.txt

      - name: Retain safe CI evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: efata777-fresh-postgres-001-016
          path: build-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Docker build laboratory; the default-branch workflow already allows manual dispatch.
  # This job cannot connect to Railway (no secrets, no Railway endpoint variables).
  docker-recovery-runner-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/schema-recovery-staging' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout candidate branch without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Docker and candidate files
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ci/recovery_docker_qualification/evidence
          docker info >/dev/null
          bash -n ci/recovery_docker_qualification/qualify_exact_checkout_docker.sh
          test "$GITHUB_REF" = "refs/heads/fix/schema-recovery-staging"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test -f ci/recovery_docker_qualification/SHA256SUMS.txt

      - name: Qualify exact pinned checkout, actual Docker image and fail-closed smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ci/recovery_docker_qualification/qualify_exact_checkout_docker.sh

      - name: Keep build and runtime evidence (no Railway credentials)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: efata777-docker-recovery-qualification
          path: ci/recovery_docker_qualification/evidence/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
